services:
  qdrant:
    image: qdrant/qdrant:v1.16.0
    ports:
      - "127.0.0.1:${MUTUNE_PORT:-6333}:6333"
      - "127.0.0.1:${MUTUNE_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    cpus: "${MUTUNE_CPUS:-16}"
    mem_limit: "${MUTUNE_MEMORY:-64g}"
volumes:
  qdrant-data:
